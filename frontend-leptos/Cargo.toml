[package]
name = "cosave-frontend-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.9.0-rc0", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
